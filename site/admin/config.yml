# Fuyamo Travel admin (Sveltia CMS), at fuyamo.co.za/admin.
# Every save is stored in the GitHub repository below. GitHub then rebuilds the site and uploads it to Afrihost
# (.github/workflows/publish.yml), so changes are live a few minutes later.

backend:
  name: github
  repo: Fuyamo/Fuyamo-Travel-website
  branch: main
  commit_messages:
    create: 'Add {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: 'Upload "{{path}}"'
    deleteMedia: 'Delete "{{path}}"'

site_url: https://fuyamo.co.za
display_url: https://fuyamo.co.za
logo:
  src: /assets/brand/fuyamo-travel-icon-tile.svg

# Photos are uploaded to photos/ in the repository; the build resizes them for the site.
media_folder: photos
public_folder: /photos

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ---------- Travel Talk ----------
  - name: posts
    label: Travel Talk
    label_singular: Article
    description: Articles on the Travel Talk page. Saving publishes the article a few minutes later.
    folder: posts
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    fields:
      - { label: Title, name: title, widget: string, hint: 'Write it the way people search, e.g. "What to pack for Zanzibar".' }
      - label: Category
        name: category
        widget: select
        options: [Destination guides, Booking tips, Packing, Visa & passports, Trip stories]
        default: Destination guides
      - { label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: D MMM YYYY, time_format: false, hint: 'Newest articles show first.' }
      - { label: Photo, name: image, widget: image, hint: 'Shown on the Travel Talk page and at the top of the article. Landscape works best.' }
      - { label: Intro, name: intro, widget: text, hint: 'One or two sentences. Shown on the Travel Talk page and in Google results.' }
      - label: Article
        name: body
        widget: markdown
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote]
        editor_components: [image]
        hint: 'Use headings to break it into sections. Link to a trip by selecting text and adding a link such as /trips/bali/.'

  # ---------- Trips ----------
  - name: trips
    label: Trips
    label_singular: Trip
    description: The group trips. Prices, dates, Yamo links, what's included and photos.
    folder: content/trips
    extension: json
    format: json
    create: true
    identifier_field: name
    slug: '{{fields.key}}'
    summary: '{{name}} {{edition}} · {{price}}'
    sortable_fields:
      fields: [order, name]
      default: { field: order, direction: ascending }
    fields:
      - { label: Name, name: name, widget: string, hint: 'e.g. "Bali".' }
      - { label: Edition tag, name: edition, widget: string, required: false, hint: 'Optional label on the photo, e.g. "Family Edition".' }
      - label: Web address
        name: key
        widget: string
        pattern: ['^[a-z0-9-]+$', 'Use lowercase letters, numbers and dashes only.']
        hint: 'The page address: fuyamo.co.za/trips/<this>/. Changing it breaks links people have already shared.'
      - { label: Order, name: order, widget: number, value_type: int, default: 10, hint: 'Position in trip lists: 1 shows first.' }
      - { label: Hide from the website, name: hidden, widget: boolean, default: false, required: false, hint: 'Turn on to take the trip off the site without deleting it.' }
      - { label: Menu label, name: menu_label, widget: string, required: false, hint: 'Shorter name for menus and search, e.g. "Lesotho · Family Edition". Empty = the name.' }
      - { label: Countries, name: place, widget: string, hint: 'In capitals, e.g. "ZIMBABWE · ZAMBIA · BOTSWANA".' }
      - { label: Stops, name: subtitle, widget: string, hint: 'In capitals, e.g. "UBUD · CANGGU · ULUWATU".' }
      - label: Travel by
        name: type
        widget: select
        options: [{ label: Fly, value: fly }, { label: Road trip, value: road }]
        default: fly
      - { label: Family trip, name: family, widget: boolean, default: false, required: false, hint: 'Shows the trip under the Family filter.' }
      - { label: Length, name: nights, widget: string, hint: 'e.g. "5 nights · 7 days".' }
      - { label: Price per person sharing, name: price, widget: string, hint: 'e.g. "R29,500". Used on cards and as the "from" price.' }
      - label: Separate prices
        name: prices
        widget: list
        required: false
        summary: '{{amount}} {{label}}'
        hint: 'Only when prices differ, e.g. parents and children. Otherwise leave this empty.'
        fields:
          - { label: Amount, name: amount, widget: string, hint: 'e.g. "R7,000".' }
          - { label: Label, name: label, widget: string, hint: 'e.g. "pp parents" or "per child".' }
      - { label: Deposit, name: deposit, widget: string, hint: 'e.g. "R3,500".' }
      - { label: EFT reference, name: reference, widget: string, hint: 'What people add after their name when paying, e.g. "Bali".' }
      - { label: Short description, name: blurb, widget: text, hint: 'Two sentences under the photos on the trip page.' }
      - label: Departures
        name: departures
        widget: list
        min: 1
        summary: '{{dates}}'
        fields:
          - label: Dates
            name: dates
            widget: string
            pattern: ['^\d{1,2}.*\s(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s\d{4}$', 'Write the dates like "21–28 Mar 2027".']
            hint: 'Like "21–28 Mar 2027".'
          - { label: Yamo booking link, name: yamo, widget: string, required: false, hint: 'Paste this departure''s link from Yamo (app.yamo.travel/t/…). "Reserve seat" opens it.' }
      - { label: What's included, name: included, widget: list, field: { label: Item, name: item, widget: string } }
      - { label: Optional extras, name: optional, widget: list, required: false, field: { label: Extra, name: extra, widget: string }, hint: 'Activities people can add at their own cost.' }
      - { label: Cover photo, name: cover, widget: image, hint: 'Trip cards, the main photo on the trip page and link previews.' }
      - { label: Gallery, name: gallery, widget: list, min: 3, max: 3, field: { label: Photo, name: photo, widget: image }, hint: 'Three photos beside the cover on the trip page.' }

  # ---------- Photos, FAQs, reviews ----------
  - name: site
    label: Photos, FAQs & reviews
    description: Section photos around the site, the questions and answers, and the Google reviews.
    files:
      - name: photos
        label: Photos
        file: content/photos.json
        format: json
        fields:
          - label: Page headers
            name: headers
            widget: object
            hint: 'The big photo at the top of each page. Landscape works best.'
            fields:
              - { label: Home, name: home, widget: image, hint: 'At least 2000px wide.' }
              - { label: Group trips, name: trips, widget: image }
              - { label: Calendar, name: calendar, widget: image }
              - { label: Services, name: services, widget: image }
              - { label: About, name: about, widget: image }
              - { label: How to book, name: how_to_book, widget: image }
              - { label: Corporate, name: corporate, widget: image }
              - { label: Contact, name: contact, widget: image }
              - { label: Travel Talk (link previews only), name: travel_talk, widget: image }
              - { label: Yamo (link previews only), name: yamo, widget: image }
          - { label: Intro photo pills, name: intro, widget: list, min: 3, max: 3, field: { label: Photo, name: photo, widget: image }, hint: 'The three small rounded photos in "We plan the flights, the stays…".' }
          - { label: Why cards, name: why, widget: list, min: 5, max: 5, field: { label: Photo, name: photo, widget: image }, hint: 'One per "Travel, minus the stress" card, in card order.' }
          - label: Moments worth the trip
            name: moments
            widget: list
            summary: '{{caption}}'
            hint: 'The drifting polaroids on the home page. Add as many as you like; real travellers having fun work best.'
            fields:
              - { label: Photo, name: image, widget: image }
              - { label: Caption, name: caption, widget: string, hint: 'A place, e.g. "Zanzibar".' }
              - { label: Links to trip, name: trip, widget: relation, collection: trips, value_field: key, search_fields: [name], display_fields: [name], required: false, hint: 'Empty: the trip named in the caption.' }
          - { label: About page, name: about, widget: list, min: 2, max: 2, field: { label: Photo, name: photo, widget: image } }
          - { label: Services page, name: services, widget: list, min: 3, max: 3, field: { label: Photo, name: photo, widget: image }, hint: 'Group travel, tailored travel, public sector & corporate.' }
          - { label: How to book (last step), name: how_to_book, widget: image }
          - { label: Birthday offer popup, name: birthday_popup, widget: image }
          - { label: Yamo passport, name: yamo_passport, widget: image, hint: 'The photo taped into the passport on the Yamo page.' }

      - name: faqs
        label: FAQs
        file: content/faqs.json
        format: json
        fields:
          - label: Questions
            name: faqs
            widget: list
            summary: '{{question}}'
            hint: 'The first four also show on the home page.'
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }

      - name: reviews
        label: Google reviews
        file: content/reviews.json
        format: json
        fields:
          - { label: Rating, name: rating, widget: string, hint: 'As shown on Google, e.g. "5.0".' }
          - { label: Number of reviews, name: count, widget: string }
          - { label: Review link, name: link, widget: string, hint: 'Your Google "leave a review" link.' }
          - label: Reviews
            name: reviews
            widget: list
            summary: '{{name}} · {{when}}'
            hint: 'Newest first. Copy them as written on Google.'
            fields:
              - { label: Name, name: name, widget: string, hint: 'First name and initial, e.g. "Lucky M.".' }
              - { label: When, name: when, widget: string, hint: 'Month and year, e.g. "Jan 2026".' }
              - { label: Stars, name: rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }
              - { label: Trip, name: trip, widget: string, required: false, hint: 'Optional, in capitals, e.g. "MOZAMBIQUE".' }
              - { label: Review, name: text, widget: text }
