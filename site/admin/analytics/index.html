<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fuyamo analytics</title>
  <link rel="icon" href="/assets/brand/fuyamo-travel-icon-tile.svg" type="image/svg+xml">
  <style>
    :root { --ink: #111; --paper: #F4F2ED; --muted: #6E6A62; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; }
    .links a { text-decoration: none; color: var(--ink); background: var(--paper); padding: 9px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }
    .links a:hover { background: #E9E6E0; }
    .report { width: 100%; height: 1400px; border: 0; border-radius: 16px; background: var(--paper); }
    .empty { padding: 28px; border-radius: 16px; background: var(--paper); }
    .empty p { margin: 0 0 10px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Fuyamo analytics</h1>
      <nav class="links">
        <a href="/admin/">← Admin</a>
        <a href="https://analytics.google.com/" target="_blank" rel="noopener">Google Analytics</a>
        <a href="https://search.google.com/search-console" target="_blank" rel="noopener">Search Console</a>
      </nav>
    </header>
    <div id="report"></div>
  </div>
  <script>
    // The dashboard is a Looker Studio report on the site's Google Analytics data. Paste its embed address here
    // (in Looker Studio: File → Embed report → Embed URL). It shows when you're signed in to Google.
    const REPORT = '';
    const box = document.getElementById('report');
    box.innerHTML = REPORT
      ? '<iframe class="report" src="' + REPORT + '" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>'
      : '<div class="empty"><p><strong>The dashboard isn\'t connected yet.</strong></p><p>Until it is, open Google Analytics: Reports → Realtime for today\'s visitors, and Reports → Engagement → Events for the button test (seen_ and click_ events).</p></div>';
  </script>
</body>
</html>
