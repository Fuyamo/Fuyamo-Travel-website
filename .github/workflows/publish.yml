# Publishes fuyamo.co.za. Runs after every change (a save in the admin, or a push), and can be run by hand
# from the Actions tab. It builds the pages on a Mac (the build uses macOS's image tools) and puts the finished
# site on the "live" branch. The hosting checks that branch every 5 minutes and copies any new version into
# public_html (a cron job on Afrihost, see README), so no passwords are stored here.

name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to update the live branch

# One publish at a time; a newer change waits for the current one to finish.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The build's summary (and anything that needs attention) is shown on the run's page.
      - name: Build the pages
        run: |
          set -o pipefail
          osascript -l JavaScript tools/build.js "$PWD" 2>&1 | tee build.log || { echo "::error title=Build failed::$(tail -c 1500 build.log | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Build::$(tail -c 1500 build.log | tr '\n' ' ')"

      # The live branch holds only the finished site (one commit, replaced each time).
      - name: Put the site on the live branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Which version this is, so the admin can tell when a change is live.
          printf '{"commit":"%s","built":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site/build.json
          cd site
          git init -q -b live
          git add -A
          git -c user.name="Fuyamo publisher" -c user.email="info@fuyamo.co.za" commit -qm "Site built from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live
